apiVersion: 1

datasources:
  - name: Prometheus
    uid: prom
    type: prometheus
    url: http://prometheus:9090
    isDefault: true
    access: proxy

  - name: Loki
    uid: loki
    type: loki
    url: http://loki:3100
    access: proxy

  - name: Tempo
    uid: tempo
    type: tempo
    url: http://tempo:3200
    access: proxy
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        tags:
          - key: service.name
            value: service_name
      tracesToMetrics:
        datasourceUid: prom