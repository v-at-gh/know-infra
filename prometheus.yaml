global:
  scrape_interval: 5s
  external_labels:
    cluster: know-infra

scrape_configs:
  - job_name: otel-collector-self
    static_configs:
      - targets: ['otel-collector:8888']

  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8889']

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: loki
    static_configs:
      - targets: ['loki:3100']
    metrics_path: /metrics

  - job_name: tempo
    static_configs:
      - targets: ['tempo:3200']
    metrics_path: /metrics

  - job_name: grafana
    static_configs:
      - targets: ['grafana:3000']
    metrics_path: /metrics

  - job_name: alloy
    static_configs:
      - targets: ['alloy:12345']