stream_over_http_enabled: true

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/traces

backend_scheduler:
  provider:
    compaction:
      compaction:
        block_retention: ${TEMPO_BLOCK_RETENTION}

backend_worker:
  compaction:
    block_retention: ${TEMPO_BLOCK_RETENTION}

usage_report:
  reporting_enabled: false

querier: {}
query_frontend: {}