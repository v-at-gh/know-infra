services:
  prepare-volumes:
    image: alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
    container_name: ${STACK_PREFIX:-know}-prepare-volumes
    user: "0:0"
    volumes:
      - ./data/prometheus:/d/prometheus
      - ./data/loki:/d/loki
      - ./data/tempo:/d/tempo
      - ./data/grafana:/d/grafana
      - ./data/alloy:/d/alloy
    command:
      - sh
      - -c
      - |
        set -e
        chown_if_needed() {
          target="$$1"; dir="$$2"
          current_uid=$$(stat -c '%u' "$$dir")
          current_gid=$$(stat -c '%g' "$$dir")
          if [ "$$current_uid:$$current_gid" = "$$target" ]; then
            echo "  [skip] $$dir already $$target"
          else
            chown -R "$$target" "$$dir"
            echo "  [chown] $$dir $$current_uid:$$current_gid -> $$target"
          fi
        }
        echo "=== prepare-volumes ==="
        chown_if_needed 65534:65534 /d/prometheus
        chown_if_needed 10001:10001 /d/loki
        chown_if_needed 10001:10001 /d/tempo
        chown_if_needed 472:472     /d/grafana
        chown_if_needed 0:0         /d/alloy
        echo "=== done ==="
    restart: "no"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:v0.163.2@sha256:7f22d2a6748110ffb6a59bc0df448bccbf501cdb667d610ede4c61d3863d5849
    container_name: ${STACK_PREFIX:-know}-otel-collector
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./collector.yaml:/etc/otel/config.yaml:ro
    ports:
      - "${OTEL_GRPC_PORT:-4317}:4317"
      - "${OTEL_HTTP_PORT:-4318}:4318"
    environment:
      - SAMPLING_PERCENTAGE=${SAMPLING_PERCENTAGE:-10}
    networks:
      - know-telemetry
    restart: unless-stopped

  prometheus:
    depends_on:
      prepare-volumes:
        condition: service_completed_successfully
    image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    container_name: ${STACK_PREFIX:-know}-prometheus
    user: "65534:65534"
    stop_grace_period: 30s
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - ./data/prometheus:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - know-telemetry
    restart: unless-stopped

  loki:
    depends_on:
      prepare-volumes:
        condition: service_completed_successfully
    image: grafana/loki:3.7.9@sha256:0db216b630ae1f348a1584c67f3cead8b4c1fc839169a39501db664744158e28
    container_name: ${STACK_PREFIX:-know}-loki
    user: "10001:10001"
    stop_grace_period: 30s
    volumes:
      - ./loki-config.yaml:/etc/loki/config.yaml:ro
      - ./data/loki:/loki
    ports:
      - "${LOKI_PORT:-3100}:3100"
    environment:
      - LOKI_AUTH_ENABLED=${LOKI_AUTH_ENABLED:-false}
    networks:
      - know-telemetry
    restart: unless-stopped

  tempo-validate:
    image: grafana/tempo:3.1.1@sha256:64e2fbd56d9c2b3412a4b430a58ea59e91a670b1e75f920a0c702213ad145044
    container_name: ${STACK_PREFIX:-know}-tempo-validate
    command:
      - "-config.file=/etc/tempo.yaml"
      - "-config.verify=true"
      - "-config.expand-env=true"
    environment:
      - TEMPO_BLOCK_RETENTION=${TEMPO_BLOCK_RETENTION:-168h}
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
    networks:
      - know-telemetry
    restart: "no"

  tempo:
    depends_on:
      prepare-volumes:
        condition: service_completed_successfully
      tempo-validate:
        condition: service_completed_successfully
    image: grafana/tempo:3.1.1@sha256:64e2fbd56d9c2b3412a4b430a58ea59e91a670b1e75f920a0c702213ad145044
    container_name: ${STACK_PREFIX:-know}-tempo
    user: "10001:10001"
    stop_grace_period: 30s
    command:
      - "-config.file=/etc/tempo.yaml"
      - "-config.expand-env=true"
    environment:
      - TEMPO_BLOCK_RETENTION=${TEMPO_BLOCK_RETENTION:-168h}
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
      - ./data/tempo:/var/tempo
    ports:
      - "${TEMPO_PORT:-3200}:3200"
    networks:
      - know-telemetry
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/tempo", "-health", "-health.url=http://localhost:3200/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  grafana:
    depends_on:
      prepare-volumes:
        condition: service_completed_successfully
    image: grafana/grafana:13.3.0@sha256:488984b716c0862639f91a698adbe2862677a5a07bad42da5f03f3030883b205
    container_name: ${STACK_PREFIX:-know}-grafana
    user: "472:472"
    volumes:
      - ./data/grafana:/var/lib/grafana
      - ./grafana-provisioning:/etc/grafana/provisioning:ro
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_AUTH_ANONYMOUS_ENABLED=${GRAFANA_ANON_ENABLED:-false}
      - GF_AUTH_ANONYMOUS_ORG_ROLE=${GRAFANA_ANON_ROLE:-Viewer}
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_PLUGINS_PREINSTALL_DISABLED=true
      - GF_PLUGINS_PREINSTALL_SYNC=
      - GF_PLUGINS_PREINSTALL_ASYNC=
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    networks:
      - know-telemetry
    restart: unless-stopped

  alloy:
    depends_on:
      prepare-volumes:
        condition: service_completed_successfully
      loki:
        condition: service_started
    image: grafana/alloy:v24.04@sha256:8ab871206bd2d8f89277f53abffee5f452a293980788d52f85fa183a87a505a4
    container_name: ${STACK_PREFIX:-know}-alloy
    user: "0:0"
    volumes:
      - ./alloy.river:/etc/alloy/config.river:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./data/alloy:/var/lib/alloy
    ports:
      - "${ALLOY_PORT:-12345}:12345"
    command:
      - run
      - /etc/alloy/config.river
      - --storage.path=/var/lib/alloy
      - --server.http.listen-addr=0.0.0.0:12345
    networks:
      - know-telemetry
    restart: unless-stopped

networks:
  know-telemetry:
    driver: bridge
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET:-172.20.0.0/24}